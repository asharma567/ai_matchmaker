# docker-compose.yml - Local staging environment
version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dating_bot_postgres_staging
    environment:
      POSTGRES_USER: dating_bot_user
      POSTGRES_PASSWORD: dating_bot_pass
      POSTGRES_DB: dating_bot_staging
    ports:
      - "5432:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dating_bot_user -d dating_bot_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dating_bot_redis_staging
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_staging_data:
  redis_staging_data: